<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>webcuahuy</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7ff;--card:#fff;--ink:#0f1b33;--mut:#5d6b86;--pri:#2563eb;--pri2:#1e40af;--soft:#e6eeff;--line:#dbe5fa;--ok:#12a150;--bad:#d92d3a;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{font-weight:700;font-size:18px;color:var(--pri2)}.brand span{color:var(--pri)}
nav{display:flex;gap:4px;margin:0 auto}nav button{border:0;background:none;padding:8px 14px;border-radius:12px;font:inherit;font-weight:500;color:var(--mut);cursor:pointer}
nav button.on{background:var(--soft);color:var(--pri2)}
main{max-width:920px;margin:0 auto;padding:22px 16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}h3{margin:0 0 6px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 6px 24px rgba(37,99,235,.06)}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:24px;padding:28px;margin-bottom:16px}.hero p{opacity:.9;max-width:520px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.stat b{display:block;font-size:28px;color:var(--pri2)}.stat span{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:12px;font:inherit;font-weight:500;cursor:pointer;display:inline-block;transition:transform .12s,background .12s}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}.hero .btn.pri{background:#fff;color:var(--pri2)}
.btn.bad{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px}.btn[disabled]{opacity:.5;pointer-events:none}
.ico{border:0;background:var(--soft);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
label.l{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}.f2{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.w{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}.w:last-child{border:0}
.ipa{color:var(--pri);margin:0 6px}.ex{color:var(--mut);font-size:13px}.tag{background:var(--soft);color:var(--pri2);border-radius:8px;padding:1px 8px;font-size:12px;margin-left:4px}
.known b{color:var(--ok)}.empty{text-align:center;color:var(--mut);padding:26px}
.ov{position:fixed;inset:0;background:rgba(15,27,51,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.sheet{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.fc{perspective:1000px;margin:10px auto;max-width:480px;height:300px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,1.35,.5,1);transform-style:preserve-3d}.fc.flip .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 36px rgba(37,99,235,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px;overflow:auto}
.face.bk{transform:rotateY(180deg)}.big{font-size:34px;font-weight:700;color:var(--pri2)}
.ok{color:var(--ok)}.no{color:var(--bad)}.msg{padding:12px;border-radius:12px;margin:12px 0}.msg.ok{background:#e7f8ee}.msg.no{background:#fdecee}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.bars i{display:block;background:var(--pri);border-radius:8px 8px 0 0;min-height:3px;margin-bottom:4px}
.prev{max-width:100%;max-height:260px;border-radius:14px;display:block;margin:12px 0}.itm{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
pre{background:#0f1b33;color:#cfe0ff;padding:12px;border-radius:12px;overflow:auto;font-size:12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}#toast.on{opacity:1}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}.msg{animation:pop .25s ease-out}.msg.no{animation:shk .35s}.fc{animation:pop .3s ease-out}.itm{animation:pop .25s ease-out}
@media(max-width:720px){nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);margin:0;padding:6px;justify-content:space-around;z-index:6}nav button{padding:8px 6px;font-size:12px}.f2{grid-template-columns:1fr}h1{font-size:25px}header{padding:10px 14px}.sp.h{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.brand span{background:linear-gradient(90deg,#2563eb,#a855f7,#ec4899,#f59e0b,#2563eb);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand 6s linear infinite}@keyframes brand{to{background-position:200% 0}}
nav button.on{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.35)}
.btn.pri{background:linear-gradient(135deg,#2563eb,#7c3aed);border-color:transparent}.btn.pri:hover{background:linear-gradient(135deg,#1d4ed8,#6d28d9);transform:translateY(-1px)}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;min-height:230px;background:linear-gradient(120deg,#2563eb,#7c3aed,#ec4899,#f59e0b);background-size:300% 300%;animation:herobg 12s ease-in-out infinite}@keyframes herobg{50%{background-position:100% 50%}}
.hero .btn.pri:hover{background:#fff7ed}.ht{position:relative;z-index:2;flex:1}.art{position:relative;flex:0 0 42%;height:200px}
.fcard{position:absolute;background:#fff;color:#1e40af;border-radius:14px;padding:8px 14px;font-weight:700;box-shadow:0 10px 26px rgba(15,27,51,.28);animation:flt 5s ease-in-out infinite}.fcard small{display:block;color:#7c3aed;font-weight:500;font-size:11px}
@keyframes flt{50%{transform:translateY(-14px) rotate(var(--r))}}
.rk{position:absolute;font-size:34px;animation:fly 7s linear infinite}@keyframes fly{from{left:-10%;top:90%;transform:rotate(45deg)}to{left:105%;top:-15%;transform:rotate(45deg)}}
.pl{position:absolute;right:6%;top:4%;font-size:40px;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.twk{position:absolute;color:#fff;font-style:normal;animation:twk 2.4s ease-in-out infinite}@keyframes twk{50%{opacity:.15;transform:scale(.5)}}
.stat{transition:transform .2s,box-shadow .2s}.stat:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(124,58,237,.18)}
.stat b{background:linear-gradient(135deg,#2563eb,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid .stat:nth-child(4n+1){background:linear-gradient(135deg,#e0ecff,#fff)}.grid .stat:nth-child(4n+2){background:linear-gradient(135deg,#ede9fe,#fff)}.grid .stat:nth-child(4n+3){background:linear-gradient(135deg,#fce7f3,#fff)}.grid .stat:nth-child(4n){background:linear-gradient(135deg,#fef3c7,#fff)}
.bars i{background:linear-gradient(180deg,#ec4899,#7c3aed 45%,#2563eb);transform-origin:bottom;animation:grow .8s ease-out}@keyframes grow{from{transform:scaleY(0)}}
.big{background:linear-gradient(90deg,#2563eb,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.face{background:linear-gradient(160deg,#fff,#eef4ff)}.face.bk{background:linear-gradient(160deg,#fff7ed,#fdf2f8)}.msg.ok{background:linear-gradient(90deg,#d1fae5,#ecfeff)}
.cf{position:fixed;top:40%;width:8px;height:12px;border-radius:2px;z-index:40;pointer-events:none;animation:cf 1.2s ease-out forwards}@keyframes cf{to{transform:translate(var(--dx),260px) rotate(540deg);opacity:0}}
@media(max-width:720px){.hero{flex-direction:column;align-items:stretch}.art{flex:none;width:100%;height:150px}}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.th{position:relative}.th img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line);animation:pop .25s ease-out}
.th .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;line-height:1}
.ck{width:auto;margin-right:6px;accent-color:#7c3aed}.selbar{padding:8px 0;border-bottom:1px solid var(--line);position:sticky;top:56px;background:#fff;z-index:2}
</style>
</head>
<body>
<header><div class="brand">Smart<span>Vocab</span></div>
<nav><button data-act="go" data-v="home" data-nav="home">Trang chủ</button><button data-act="go" data-v="decks" data-nav="decks">Bộ từ vựng</button><button data-act="go" data-v="scan" data-nav="scan">Quét ảnh</button><button data-act="go" data-v="practice" data-nav="practice">Luyện tập</button><button data-act="go" data-v="stats" data-nav="stats">Thống kê</button></nav>
<button class="btn sm" id="snd" data-act="snd" title="Bật/tắt âm thanh">🔊</button><button class="btn sm" data-act="settings" title="Cấu hình AI">⚙ AI</button></header>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
const KEY='smartvocab_v1',LV=['A1','A2','B1','B2','C1'];
const PROMPT='You are an OCR assistant for English learners. Read the image and extract ONLY the English vocabulary items that actually appear in it (words or short phrases), with the Vietnamese meaning if it is written in the image. Never invent words that are not in the image. If a Vietnamese meaning is missing, add a concise one. Fill in ipa, pos (noun, verb, adjective...), a short, SIMPLE example sentence (ex) whose difficulty matches the CEFR level of the word (A1-A2 words: 5-9 words, everyday context, nothing harder than the target word; never an academic or formal sentence) and its Vietnamese translation (exVi) when missing. Return ONLY a JSON array of objects: [{"en":"","vi":"","ipa":"","pos":"","ex":"","exVi":""}]. If there is no vocabulary, return [].';
const WORKER=`export default{async fetch(req,env){
 const cors={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type'};
 if(req.method==='OPTIONS')return new Response(null,{headers:cors});
 const {image,mime,prompt}=await req.json();
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':env.GEMINI_KEY},body:JSON.stringify({contents:[{parts:[{text:prompt},...(image?[{inline_data:{mime_type:mime,data:image}}]:[])]}],generationConfig:{responseMimeType:'application/json'}})});
 const j=await r.json();
 return new Response(JSON.stringify({text:j.candidates?.[0]?.content?.parts?.[0]?.text||''}),{headers:{...cors,'Content-Type':'application/json'}})}}`;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.decks)return d}catch(e){}
 return{decks:[{id:uid(),name:'Bộ từ vựng của tôi',words:[]}],log:{},set:{mode:'gemini',key:'',model:'gemini-2.0-flash',proxy:''}}}
let D=load();
let S={sel:new Set(),selMode:false,view:'home',deck:null,q:'',lvl:'',scan:{imgs:[],items:null,busy:false,err:''},P:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Không lưu được dữ liệu (bộ nhớ đầy?)')}}
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms||2600)}
const allW=()=>D.decks.flatMap(d=>d.words);
function findW(id){for(const d of D.decks){const w=d.words.find(x=>x.id===id);if(w)return{w,d}}}
const dstr=k=>new Date(Date.now()-k*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(o){return{id:uid(),en:(o.en||'').trim(),vi:(o.vi||'').trim(),ipa:(o.ipa||'').trim(),pos:(o.pos||'').trim(),ex:(o.ex||'').trim(),exVi:(o.exVi||'').trim(),level:o.level||'',known:!!o.known,acc:Array.isArray(o.acc)?o.acc.map(x=>String(x).trim()).filter(Boolean):[]}}
function logP(id,ok){const t=D.log[dstr(0)]||(D.log[dstr(0)]={n:0,c:0,ids:[]});if(ok!==undefined){t.n++;if(ok)t.c++;const f=findW(id);if(f){const st=f.w.st||(f.w.st={c:0,x:0,lw:false});ok?st.c++:st.x++;st.lw=!ok}}if(!t.ids.includes(id))t.ids.push(id);save()}
function stopSay(){say.k=(say.k||0)+1;if('speechSynthesis' in window)speechSynthesis.cancel()}
function say(t){if(!('speechSynthesis' in window))return toast('Trình duyệt không hỗ trợ đọc văn bản');stopSay();const id=say.k,u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;
 const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));u.voice=vs.find(v=>/Google US|Natural|Samantha|Aria|Jenny/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs[0]||null;setTimeout(()=>{if(say.k===id)speechSynthesis.speak(u)},40)}
const spk=t=>`<button class="ico" data-act="say" data-t="${esc(t)}" aria-label="Phát âm">🔊</button>`;
const lvSel=(id,v,all)=>`<select id="${id}">${all?'<option value="">'+all+'</option>':'<option value="">Chưa chọn</option>'}${LV.map(l=>`<option ${l===v?'selected':''}>${l}</option>`).join('')}</select>`;

/* ---------- Views ---------- */
function render(){stopSay();if(document.activeElement&&document.activeElement.tagName==='BUTTON')document.activeElement.blur();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.view));
 $('#app').innerHTML={home:vHome,decks:vDecks,scan:vScan,practice:vPractice,stats:vStats}[S.view]();$('#ans')?.focus();countUp();{const sb=$('#snd');if(sb)sb.textContent=D.set.snd===false?'🔇':'🔊'}const P=S.P;if(P&&S.view==='practice'){if(P.say){P.say=false;const w=P.mode==='card'?P.list[P.i]:P.mode==='en-vi'?P.queue[P.i]:null;if(w&&D.set.auto!==false)say(w.en)}if(P.mode==='game'&&$('#gc'))initGame()}}
function counts(){const w=allW(),k=w.filter(x=>x.known).length,t=D.log[dstr(0)];return{total:w.length,k,u:w.length-k,today:t?t.ids.length:0,n:t?t.n:0}}
function vHome(){const c=counts(),s=D.set,ready=s.mode==='proxy'?s.proxy:s.key;
 return `<section class="hero"><div class="art" aria-hidden="true"><span class="pl">🪐</span><span class="fcard" style="left:4%;top:8%;--r:-6deg">vocabulary<small>từ vựng</small></span><span class="fcard" style="left:38%;top:40%;--r:5deg;animation-delay:-1.7s">mitigate<small>giảm nhẹ</small></span><span class="fcard" style="left:6%;top:62%;--r:-3deg;animation-delay:-3.2s">river<small>dòng sông</small></span><span class="rk">🚀</span><i class="twk" style="left:30%;top:6%">✦</i><i class="twk" style="left:70%;top:55%;animation-delay:-.8s">✦</i><i class="twk" style="left:86%;top:80%;animation-delay:-1.5s">✧</i></div><div class="ht"><h1>Chụp trang sách,<br>có ngay bộ flashcard.</h1><p>Quét ảnh vở ghi chép hoặc danh sách từ, chỉnh lại kết quả rồi lưu. Luyện gõ và lật thẻ mỗi ngày.</p><div class="row"><button class="btn pri" data-act="go" data-v="scan">Quét ảnh</button><button class="btn" data-act="go" data-v="practice">Luyện tập</button><button class="btn" data-act="go" data-v="decks">Bộ từ vựng</button></div></div></section>
 <div class="grid"><div class="stat"><b data-n="${c.total}">${c.total}</b><span>Từ đã lưu</span></div><div class="stat"><b data-n="${c.k}">${c.k}</b><span>Đã thuộc</span></div><div class="stat"><b data-n="${c.u}">${c.u}</b><span>Chưa thuộc</span></div><div class="stat"><b data-n="${c.today}">${c.today}</b><span>Luyện hôm nay</span></div></div>
 ${ready?'':'<div class="card"><h3>Chưa cấu hình AI</h3><p>Chức năng quét ảnh cần API key (hoặc proxy của bạn). Các chức năng khác vẫn dùng được bình thường.</p><button class="btn pri" data-act="settings">Cấu hình AI</button></div>'}`}

function vDecks(){
 if(S.deck){const d=D.decks.find(x=>x.id===S.deck);if(!d){S.deck=null;return vDecks()}
  return `<div class="row"><button class="btn" data-act="back">← Các bộ</button><h2 class="sp" style="margin:0">${esc(d.name)} (${d.words.length})</h2></div>
  <div class="card" style="margin-top:14px"><div class="row"><div class="sp" style="min-width:180px"><input id="q" placeholder="Tìm từ hoặc nghĩa…" value="${esc(S.q)}"></div><div style="width:130px">${lvSel('lvl',S.lvl,'Mọi trình độ')}</div><button class="btn pri" data-act="addw">+ Thêm từ</button><button class="btn" data-act="bulk">Dán hàng loạt</button><button class="btn" data-act="selmode">${S.selMode?'Xong':'Chọn nhiều'}</button></div><div id="wl">${wordList()}</div></div>`}
 return `<div class="card"><h2>Tạo bộ từ vựng</h2><div class="row"><div class="sp"><input id="newdeck" placeholder="Tên chủ đề, ví dụ: IELTS Environment"></div><button class="btn pri" data-act="newdeck">Tạo bộ</button></div></div>
 ${D.decks.map(d=>`<div class="card"><div class="row"><div class="sp"><h3>${esc(d.name)}</h3><span class="ex">${d.words.length} từ · ${d.words.filter(w=>w.known).length} đã thuộc</span></div><button class="btn pri sm" data-act="open" data-id="${d.id}">Mở</button><button class="btn sm" data-act="rename" data-id="${d.id}">Đổi tên</button><button class="btn sm bad" data-act="deldeck" data-id="${d.id}">Xóa</button></div></div>`).join('')}
 <div class="card"><h3>Sao lưu dữ liệu</h3><div class="row"><button class="btn" data-act="export">Xuất CSV</button><label class="btn">Nhập CSV<input id="f_csv" type="file" accept=".csv,text/csv" hidden></label></div></div>`}
function visW(){const d=D.decks.find(x=>x.id===S.deck),q=S.q.trim().toLowerCase();return d.words.filter(w=>(!S.lvl||w.level===S.lvl)&&(!q||(w.en+' '+w.vi).toLowerCase().includes(q)))}
function selBar(ws){return `<div class="row selbar"><label class="row" style="gap:6px"><input type="checkbox" class="ck" data-act="selall" ${ws.length&&ws.every(w=>S.sel.has(w.id))?'checked':''}>Chọn tất cả (${ws.length})</label><span class="sp"></span><button class="btn sm bad" data-act="delsel" ${S.sel.size?'':'disabled'}>Xóa ${S.sel.size} từ đã chọn</button></div>`}
function wordList(){const d=D.decks.find(x=>x.id===S.deck),q=S.q.trim().toLowerCase();
 const ws=d.words.filter(w=>(!S.lvl||w.level===S.lvl)&&(!q||(w.en+' '+w.vi).toLowerCase().includes(q)));
 if(!ws.length)return '<div class="empty">Chưa có từ nào phù hợp. Thêm từ thủ công, dán hàng loạt hoặc quét ảnh.</div>';
 return (S.selMode?selBar(ws):'')+ws.map(w=>`<div class="w ${w.known?'known':''}"><div><div class="row" style="gap:4px">${S.selMode?`<input type="checkbox" class="ck" data-id="${w.id}" ${S.sel.has(w.id)?'checked':''}>`:''}<b>${esc(w.en)}</b>${spk(w.en)}${w.ipa?`<span class="ipa">/${esc(w.ipa.replace(/\//g,''))}/</span>`:''}${w.pos?`<i class="ex">${esc(w.pos)}</i>`:''}${w.level?`<span class="tag">${w.level}</span>`:''}</div><div>${esc(w.vi)}</div>${w.ex?`<div class="ex">${esc(w.ex)} ${spk(w.ex)}<br>${esc(w.exVi)}</div>`:''}</div>

function readImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(Error('Không đọc được file'));r.onload=()=>{const i=new Image();i.onerror=()=>rej(Error('File không phải ảnh hợp lệ'));i.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.88))};i.src=r.result};r.readAsDataURL(file)})}
function parseItems(t){t=String(t).replace(/```json|```/g,'');let a=t.indexOf('['),b=t.lastIndexOf(']'),j;

function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}
